    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fff9e6;
        --surface: #ffffff;
        --red: #ff6b6b;
        --red-hover: #ff5252;
        --yellow: #ffd93d;
        --mint: #6bcb77;
        --blue: #4a90d9;
        --text: #333333;
        --text-muted: #666666;
        --radius: 14px;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .brand-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        display: block;
        margin: 0 auto 0.5rem;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.2);
      }

      .header h1 {
        font-size: 3rem;
        font-weight: 700;
        color: var(--text);
      }

      .tagline {
        color: var(--text-muted);
        margin-top: 0.5rem;
        font-weight: 500;
      }

      .main {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .label {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--blue);
        margin-bottom: 0.75rem;
        display: block;
      }

      .genre-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .genre-pill {
        background: var(--mint);
        border: 2px solid var(--mint);
        color: #ffffff;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(107, 203, 119, 0.35);
      }

      .genre-pill:hover {
        filter: brightness(1.05);
      }

      .genre-pill.active {
        background: #ffffff;
        border-color: var(--mint);
        color: var(--mint);
        box-shadow: 0 2px 8px rgba(107, 203, 119, 0.4);
      }

      .generate-btn {
        margin-top: 1rem;
        width: 100%;
        background: var(--red);
        color: white;
        border: none;
        padding: 0.85rem 1.5rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        transition: background 0.15s, transform 0.1s;
      }

      .generate-btn:hover {
        background: var(--red-hover);
      }

      .generate-btn:active {
        transform: scale(0.98);
      }

      .joke-card {
        background: var(--surface);
        border: 2px solid var(--mint);
        border-top: 5px solid var(--mint);
        border-radius: var(--radius);
        padding: 2rem;
        min-height: 140px;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 16px rgba(51, 51, 51, 0.08);
      }

      .joke-text {
        font-size: 1.2rem;
        line-height: 1.7;
        border-left: 4px solid var(--yellow);
        padding-left: 1.25rem;
        width: 100%;
        color: var(--text);
      }

      .placeholder {
        color: var(--text-muted);
        font-style: italic;
        width: 100%;
        text-align: center;
      }

      .footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 600;
      }
    </style>
  </head>

        </section>
      </main>

      <footer class="footer">Made by Joker</footer>

      const GENRES = Object.keys(JOKES);
      let selectedGenre = GENRES[0];
      const decks = {};

      function shuffle(list) {
        const copy = [...list];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function pickJoke(genre) {
        const list = JOKES[genre];
        if (!list || list.length === 0) return null;
        if (list.length === 1) return list[0];

        if (!decks[genre] || decks[genre].length === 0) {
          decks[genre] = shuffle(list);
        }

        return decks[genre].pop();
      }

      const genreGrid = document.getElementById("genre-grid");
      const generateBtn = document.getElementById("generate-btn");
      const jokeCard = document.getElementById("joke-card");

      GENRES.forEach((genre) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "genre-pill" + (genre === selectedGenre ? " active" : "");
        btn.textContent = genre;
        btn.addEventListener("click", () => {
          selectedGenre = genre;
          document.querySelectorAll(".genre-pill").forEach((p) => {
            p.classList.toggle("active", p.textContent === genre);
          });
        });
        genreGrid.appendChild(btn);
      });

      generateBtn.addEventListener("click", () => {
        const joke = pickJoke(selectedGenre);
        if (!joke) return;
        jokeCard.innerHTML = `<blockquote class="joke-text">${joke}</blockquote>`;
      });

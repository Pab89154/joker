<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joker — pick a joke genre and get a random joke instantly. Free, fun, no sign-up." />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <title>Joker — Joke Generator</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fff9e6;
        --surface: #ffffff;
        --red: #ff6b6b;
        --red-hover: #ff5252;
        --yellow: #ffd93d;
        --mint: #6bcb77;
        --blue: #4a90d9;
        --text: #333333;
        --text-muted: #666666;
        --radius: 14px;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
      }

      .header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .brand-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        object-fit: cover;
        display: block;
        margin: 0 auto 0.5rem;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.2);
      }

      .header h1 {
        font-size: 3rem;
        font-weight: 700;
        color: var(--text);
      }

      .tagline {
        color: var(--text-muted);
        margin-top: 0.5rem;
        font-weight: 500;
      }

      .main {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .label {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--blue);
        margin-bottom: 0.75rem;
        display: block;
      }

      .genre-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .genre-pill {
        background: var(--mint);
        border: 2px solid var(--mint);
        color: #ffffff;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(107, 203, 119, 0.35);
      }

      .genre-pill:hover {
        filter: brightness(1.05);
      }

      .genre-pill.active {
        background: #ffffff;
        border-color: var(--mint);
        color: var(--mint);
        box-shadow: 0 2px 8px rgba(107, 203, 119, 0.4);
      }

      .generate-btn {
        margin-top: 1rem;
        width: 100%;
        background: var(--red);
        color: white;
        border: none;
        padding: 0.85rem 1.5rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.35);
        transition: background 0.15s, transform 0.1s;
      }

      .generate-btn:hover {
        background: var(--red-hover);
      }

      .generate-btn:active {
        transform: scale(0.98);
      }

      .joke-card {
        background: var(--surface);
        border: 2px solid var(--mint);
        border-top: 5px solid var(--mint);
        border-radius: var(--radius);
        padding: 2rem;
        min-height: 140px;
        display: flex;
        align-items: center;
        box-shadow: 0 4px 16px rgba(51, 51, 51, 0.08);
      }

      .joke-text {
        font-size: 1.2rem;
        line-height: 1.7;
        border-left: 4px solid var(--yellow);
        padding-left: 1.25rem;
        width: 100%;
        color: var(--text);
      }

      .placeholder {
        color: var(--text-muted);
        font-style: italic;
        width: 100%;
        text-align: center;
      }

      .footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <img class="brand-logo" src="logo.png" alt="Joker logo" width="72" height="72" />
        <h1>Joker</h1>
        <p class="tagline">Pick a genre. Get a joke. That's it!</p>
      </header>

      <main class="main">
        <section>
          <span class="label">Pick a genre</span>
          <div class="genre-grid" id="genre-grid"></div>
          <button class="generate-btn" id="generate-btn">Generate joke</button>
        </section>

        <section class="joke-card" id="joke-card">
          <p class="placeholder">Choose a genre and hit generate!</p>
        </section>
      </main>

      <footer class="footer">Made by Joker</footer>
    </div>

    <script>
      const JOKES = {

                      "Why did the bicycle fall over? It was two-tired.",
                      "What do you call cheese that isn't yours? Nacho cheese.",
                      "Why did the coffee file a police report? It got mugged.",
                      "How does a penguin build its house? Igloos it together.",
                      "Why don't eggs tell jokes? They'd crack each other up.",
                      "What did the ocean say to the beach? Nothing — it just waved.",
                      "Why did the golfer bring two pairs of pants? In case he got a hole in one.",
                      "What do you call a factory that makes okay products? A satisfactory.",
                      "Why can't you give Elsa a balloon? Because she will let it go.",
                      "What do you call a fish wearing a bowtie? Sofishticated.",

              ],
              "One-liners": [
                      "I told my wife she was drawing her eyebrows too high. She looked surprised.",
                      "Parallel lines have so much in common. It's a shame they'll never meet.",
                      "I haven't slept for ten days, because that would be too long.",
                      "I used to think I was indecisive, but now I'm not so sure.",
                      "The early bird gets the worm, but the second mouse gets the cheese.",
                      "I threw a boomerang a few years ago. I now live in constant fear.",
                      "I have the heart of a lion… and a lifetime ban from the zoo.",
                      "My wallet is like an onion. Opening it makes me cry.",
                      "I asked the librarian if they had books on paranoia. She whispered, 'They're right behind you.'",
                      "I told my computer I needed a break. Now it won't stop sending me Kit Kat ads.",

              ],
              "Knock-knock": [

                      "Knock knock. Who's there? Boo. Boo who? Don't cry, it's just a joke!",
                      "Knock knock. Who's there? Tank. Tank who? You're welcome!",
                      "Knock knock. Who's there? Cow says. Cow says who? No, a cow says moo!",
                      "Knock knock. Who's there? Atch. Atch who? Bless you!",
                      "Knock knock. Who's there? Olive. Olive who? Olive you!",
                      "Knock knock. Who's there? Nobel. Nobel who? No bell — that's why I knocked!",
                      "Knock knock. Who's there? Alpaca. Alpaca who? Alpaca the suitcase, you pack the car!",
                      "Knock knock. Who's there? Harry. Harry who? Harry up and open the door!",
                      "Knock knock. Who's there? Justin. Justin who? Justin time for dinner!",
                      "Knock knock. Who's there? Dishes. Dishes who? Dishes the police — open up!",
                      "Knock knock. Who's there? Wooden shoe. Wooden shoe who? Wooden shoe like to hear another joke?",
                      "Knock knock. Who's there? Ice cream. Ice cream who? Ice cream if you don't let me in!",
                      "Knock knock. Who's there? Needle. Needle who? Needle little help opening the door!",
                      "Knock knock. Who's there? Interrupting cow. Interrupting cow wh— MOOO!",
                      "Knock knock. Who's there? Spell. Spell who? Okay: W-H-O.",
                      "Knock knock. Who's there? Leaf. Leaf who? Leaf me alone — I'm telling jokes!",
                      "Knock knock. Who's there? Broken pencil. Broken pencil who? Never mind. It's pointless.",
                      "Knock knock. Who's there? Cash. Cash who? No thanks, I prefer peanuts.",
                      "Knock knock. Who's there? Dozen. Dozen who? Dozen anybody want to open the door?"
              ],
              "Observational": [
                      "Why do we park on driveways and drive on parkways?",
                      "Why is it called after dark when it's really after light?",
                      "Adults are just kids who've been alive longer.",
                      "The snooze button is the most hopeful button on your phone.",
                      "Nothing makes you feel old like hearing your favorite song in a grocery store.",
                      "Why do we say tuna fish but not beef mammal?",
                      "If you clean your room, you find stuff you forgot. If you don't, you can't find anything.",
                      "English is weird. The word bed looks like a bed. Shark looks nothing like a shark.",
                      "Why is building called a building after it's already built?",
                      "You never notice how boring a wall is until you're waiting for food to heat up.",
                      "Why do we call it rush hour when nobody moves?",
                      "School teaches you that you can still fail even if you know the answers.",
                      "Why does 'abbreviation' have so many letters?",
                      "The most unrealistic thing about cartoons is how nobody ever closes a door.",
                      "Why do clocks run but never walk?",
                      "Nothing is more suspicious than a see-through bag of chips.",
                      "Why is quiet so loud when you're trying to sleep?",
                      "People say money doesn't grow on trees — then why do banks have branches?",
                      "Why do we press harder on the remote when the batteries are dying?",
                      "Every sock dryer has a secret portal to another dimension."
              ],
              "Programming / tech": [
                      "Why do programmers prefer dark mode? Because light attracts bugs.",
                      "There are only 10 types of people: those who understand binary and those who don't.",
                      "A SQL query walks into a bar, sees two tables, and asks: Can I join you?",
                      "Why do Java developers wear glasses? Because they don't C#.",
                      "I would tell you a UDP joke, but you might not get it.",
                      "How many programmers does it take to change a light bulb? None — that's a hardware problem.",
                      "Why did the developer go broke? He used up all his cache.",
                      "Why do programmers confuse Halloween and Christmas? Because Oct 31 equals Dec 25.",
                      "A programmer's favorite hangout? Foo Bar.",
                      "Why was the JavaScript developer sad? He didn't Node how to Express himself.",
                      "To understand recursion, you must first understand recursion.",
                      "There are two hard things in computer science: cache invalidation, naming things, and off-by-one errors.",
                      "How do you comfort a JavaScript bug? You console it.",
                      "Why did the web developer leave the restaurant? Because of the table layout.",
                      "99 little bugs in the code… take one down, patch it around… 127 little bugs in the code.",
                      "A QA engineer walks into a bar. Orders 1 beer. Orders 0 beers. Orders 999999999 beers. Orders a lizard.",
                      "Why did the developer get stuck in the shower? The instructions said lather, rinse, repeat.",
                      "My code doesn't have bugs. It just develops unexpected features.",
                      "It works on my machine.",
                      "A programmer puts two glasses by the bed: one full in case he's thirsty, one empty in case he's not."
              ],
              "Science": [
                      "Why don't scientists trust atoms? Because they make up everything.",
                      "What did the biologist wear on a date? Designer genes.",
                      "Why did the physics teacher break up with the biology teacher? There was no chemistry.",
                      "What is a physicist's favorite food? Fission chips.",
                      "Why are chemists great at solving problems? They have all the solutions.",
                      "What did one ion say to the other? I've got my ion you.",
                      "A photon checks into a hotel. Any luggage? No thanks — traveling light.",
                      "What is a biologist's favorite selfie? A cell-fie.",
                      "Einstein developed a theory about space. And it was about time too.",
                      "Why did the germ cross the microscope? To get to the other slide.",
                      "What do you call an educated tube? A graduated cylinder.",
                      "Want to hear a joke about sodium? Na.",
                      "What did the atom say to the electron? Stop being so negative!",
                      "Why did the plant get in trouble? It was photosynthesizing in class.",
                      "What happens when electrons lose their energy? They get Bohr-ed.",
                      "Where does bad light end up? In a prism.",
                      "Why is electricity such a good citizen? It conducts itself so well.",
                      "I told a chemistry joke… but there was no reaction.",
                      "What do you get when you cross a snowman and a vampire? Frostbite.",
                      "Why did the scientist install a knocker on his door? He wanted to win the No-bell prize!"
              ],
              "Dark humor": [
                      "My bed and I are perfect for each other. My alarm clock keeps trying to break us up.",
                      "I'm great at multitasking. I can worry and snack at the same time.",
                      "I asked my dog what's two minus two. He said nothing.",
                      "My calendar is always full. It has a lot of dates.",
                      "I told my computer I needed a break. It went to sleep mode.",
                      "I have a joke about time travel, but you didn't like it.",
                      "I tried to organize a hide-and-seek contest, but good players are hard to find.",
                      "My plants and I have an agreement. I ignore them, and they slowly quit.",
                      "I have a fear of speed bumps, but I'm slowly getting over it.",
                      "My laziness is a superpower. I can nap through anything.",
                      "I have a joke about elevators, but it has too many levels.",
                      "I'm writing a book about reverse psychology. Don't buy it.",
                      "I have a joke about paper. It's tearable.",
                      "My therapist says I have a preoccupation with vengeance. We'll see about that.",
                      "I have a joke about the unfinished symphony. Wait — never mind.",
                      "I have a joke about ghosts, but it would go right through you.",
                      "I have a joke about sleep. You won't get it until you wake up.",
                      "Why did the mushroom go to the party? Because he was a fungi.",
                      "What do you call a sad strawberry? A blueberry.",
                      "I have a joke about the fridge, but it's a little chilled."
              ],
              "Riddles": [
                      "What has hands but can't clap? A clock.",
                      "What has a head and a tail but no body? A coin.",
                      "What gets wetter the more it dries? A towel.",
                      "What can you catch but not throw? A cold.",
                      "What has keys but can't open locks? A piano.",
                      "What has a neck but no head? A bottle.",
                      "What goes up but never comes down? Your age.",
                      "What has to be broken before you can use it? An egg.",
                      "What has legs but doesn't walk? A table.",
                      "What can travel the world while staying in a corner? A stamp.",
                      "What is full of holes but still holds water? A sponge.",
                      "What gets bigger the more you take away? A hole.",
                      "What has one eye but can't see? A needle.",
                      "What has words but never speaks? A book.",
                      "What runs but never walks? A river.",
                      "What has many teeth but can't bite? A comb.",
                      "What building has the most stories? A library.",
                      "What has cities but no houses, forests but no trees? A map.",
                      "What belongs to you but other people use more than you? Your name.",
                      "I speak without a mouth and hear without ears. What am I? An echo."
              ]
      };

      const GENRES = Object.keys(JOKES);
      let selectedGenre = GENRES[0];
      const decks = {};

      function shuffle(list) {
        const copy = [...list];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function pickJoke(genre) {
        const list = JOKES[genre];
        if (!list || list.length === 0) return null;
        if (list.length === 1) return list[0];

        if (!decks[genre] || decks[genre].length === 0) {
          decks[genre] = shuffle(list);
        }

        return decks[genre].pop();
      }

      const genreGrid = document.getElementById("genre-grid");
      const generateBtn = document.getElementById("generate-btn");
      const jokeCard = document.getElementById("joke-card");

      GENRES.forEach((genre) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "genre-pill" + (genre === selectedGenre ? " active" : "");
        btn.textContent = genre;
        btn.addEventListener("click", () => {
          selectedGenre = genre;
          document.querySelectorAll(".genre-pill").forEach((p) => {
            p.classList.toggle("active", p.textContent === genre);
          });
        });
        genreGrid.appendChild(btn);
      });

      generateBtn.addEventListener("click", () => {
        const joke = pickJoke(selectedGenre);
        if (!joke) return;
        jokeCard.innerHTML = `<blockquote class="joke-text">${joke}</blockquote>`;
      });
    </script>
  </body>
</html>
